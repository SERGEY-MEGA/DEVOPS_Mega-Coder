apiVersion: v1
kind: Service
metadata:
  name: {{ include "mega-coder.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
  ports:
    - name: redis
      port: {{ .Values.service.redisPort }}
      targetPort: redis
