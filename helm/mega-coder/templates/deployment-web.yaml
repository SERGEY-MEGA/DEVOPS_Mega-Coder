apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mega-coder.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: web
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
spec:
  # Frontend также запускается в 2 репликах по требованиям ТЗ.
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/name: {{ include "mega-coder.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/name: {{ include "mega-coder.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Для frontend используем системного пользователя nginx, но тоже фиксируем UID/GID явно.
      securityContext:
        runAsNonRoot: true
        # Для nginx используем фиксированный системный UID/GID из базового alpine-образа.
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          # Этот контейнер отвечает за UI и проксирование /api/, а не за бизнес-логику приложения.
          image: {{ include "mega-coder.image" (dict "root" . "image" .Values.images.web) }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Эти переменные использует docker-entrypoint.sh при генерации nginx.conf.
            - name: PORT
              value: {{ .Values.service.webPort | quote }}
            - name: API_UPSTREAM
              value: "http://{{ include "mega-coder.fullname" . }}-api:{{ .Values.service.apiPort }}"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
