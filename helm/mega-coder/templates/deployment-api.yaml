apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mega-coder.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
spec:
  # 2 реплики backend показывают масштабирование Deployment и соответствие ТЗ.
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: {{ include "mega-coder.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: {{ include "mega-coder.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Ограничение прав на уровне Pod; UID/GID совпадают с фиксированным non-root пользователем из Dockerfile.
      securityContext:
        runAsNonRoot: true
        # Явный UID/GID убирает неоднозначность при проверке Kubernetes admission/kubelet.
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          # Образ и tag приходят из GitLab CI/CD при helm upgrade --install.
          image: {{ include "mega-coder.image" (dict "root" . "image" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            # SERVICE_NAME читается приложением и отображается в ответах /health.
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mega-coder.fullname" . }}-config
                  key: API_SERVICE_NAME
            # REDIS_URL и WORKER_BASE_URL демонстрируют связь backend с другими сервисами внутри кластера.
            - name: REDIS_URL
              value: "redis://{{ include "mega-coder.fullname" . }}-redis:{{ .Values.service.redisPort }}/0"
            - name: WORKER_BASE_URL
              value: "http://{{ include "mega-coder.fullname" . }}-worker:{{ .Values.service.workerPort }}"
            # Секрет передаётся отдельно от ConfigMap, потому что это чувствительные данные.
            - name: APP_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mega-coder.fullname" . }}-secret
                  key: APP_SHARED_SECRET
          # Readiness строже: сервис считается готовым только если доступны его зависимости.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness легче: просто подтверждает, что процесс backend жив.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
