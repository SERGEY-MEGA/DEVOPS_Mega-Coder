apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mega-coder.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/name: {{ include "mega-coder.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/name: {{ include "mega-coder.name" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Ограничение прав на уровне Pod; UID задаёт образ (USER app в Dockerfile).
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: {{ include "mega-coder.image" (dict "root" . "image" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "mega-coder.fullname" . }}-config
                  key: API_SERVICE_NAME
            - name: REDIS_URL
              value: "redis://{{ include "mega-coder.fullname" . }}-redis:{{ .Values.service.redisPort }}/0"
            - name: WORKER_BASE_URL
              value: "http://{{ include "mega-coder.fullname" . }}-worker:{{ .Values.service.workerPort }}"
            - name: APP_SHARED_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mega-coder.fullname" . }}-secret
                  key: APP_SHARED_SECRET
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
