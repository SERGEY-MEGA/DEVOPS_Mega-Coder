apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mega-coder.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
spec:
  # Redis в учебном стенде один: это вспомогательный сервис, не основная бизнес-логика приложения.
  replicas: {{ .Values.replicaCount.redis }}
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
      app.kubernetes.io/name: {{ include "mega-coder.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: redis
        app.kubernetes.io/name: {{ include "mega-coder.name" . }}
    spec:
      containers:
        - name: redis
          # Redis используется backend-ом через REDIS_URL и показывает наличие инфраструктурного сервиса.
          image: {{ include "mega-coder.image" (dict "root" . "image" .Values.images.redis) }}
          imagePullPolicy: {{ .Values.images.redis.pullPolicy }}
          ports:
            - name: redis
              containerPort: 6379
          # readinessProbe говорит Kubernetes, когда Redis уже готов принимать подключения.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # livenessProbe перезапустит контейнер, если Redis перестанет отвечать на ping.
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 20
