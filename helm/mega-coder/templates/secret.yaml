apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mega-coder.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
type: Opaque
stringData:
  # Секрет приходит из Helm values, а в CI подставляется из GitLab Variable APP_SHARED_SECRET.
  APP_SHARED_SECRET: {{ .Values.secrets.appSharedSecret | quote }}
{{- if and .Values.alerting.enabled (not .Values.alerting.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mega-coder.fullname" . }}-alerting-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mega-coder.name" . }}
    app.kubernetes.io/component: alerting
type: Opaque
stringData:
  # Реальные значения передаются через --set/External Secret/kubectl create secret.
  # В git лежат только пустые placeholders, поэтому токены Telegram не раскрываются.
  TELEGRAM_BOT_TOKEN: {{ .Values.alerting.secrets.telegramBotToken | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.alerting.secrets.telegramChatId | quote }}
  TELEGRAM_PARSE_MODE: {{ .Values.alerting.secrets.telegramParseMode | quote }}
  ALERTMANAGER_WEBHOOK_SECRET: {{ .Values.alerting.secrets.alertmanagerWebhookSecret | quote }}
  GITLAB_WEBHOOK_SECRET: {{ .Values.alerting.secrets.gitlabWebhookSecret | quote }}
{{- end }}
