# Параметры чарта — всё, что меняется при деплое, выносим сюда (требование ТЗ).
global:
  # Полный путь registry без завершающего слэша (стенд: GitLab Container Registry 192.168.1.29:5050; Git — gitlub.ru, не gitlab.com)
  imageRegistry: ""

nameOverride: ""
fullnameOverride: ""

# Namespace задаётся при установке: helm upgrade --install ... -n mega-coder --create-namespace

# Для приватного GitLab Registry CI подставляет --set-json (см. .gitlab-ci.yml).
imagePullSecrets: []

images:
  api:
    repository: api
    tag: "dev"
    pullPolicy: IfNotPresent
  web:
    repository: web
    tag: "dev"
    pullPolicy: IfNotPresent
  worker:
    repository: worker
    tag: "dev"
    pullPolicy: IfNotPresent
  alertBot:
    # Webhook receiver для Alertmanager/Grafana/GitLab -> Telegram.
    repository: alert-bot
    tag: "dev"
    pullPolicy: IfNotPresent
  reporter:
    # CronJob, который собирает Markdown-отчёт по Kubernetes/Prometheus/Loki.
    repository: reporter
    tag: "dev"
    pullPolicy: IfNotPresent
  redis:
    # Образ с Docker Hub; imageRegistry не наследуем от global (см. _helpers.tpl).
    imageRegistry: docker.io
    repository: library/redis
    tag: "7.2.7-alpine"
    pullPolicy: IfNotPresent

replicaCount:
  # По ТЗ у приложения должно быть минимум 2 реплики; Redis оставляем одиночным сервисом.
  api: 2
  web: 2
  worker: 2
  alertBot: 1
  redis: 1

service:
  # В базовом варианте достаточно ClusterIP; внешний доступ можно дать через Ingress или port-forward.
  type: ClusterIP
  # Для live-demo стенда web публикуем как NodePort, чтобы UI открывался без дополнительных port-forward.
  webType: NodePort
  webNodePort: 30080
  webPort: 8080
  apiPort: 8000
  workerPort: 8081
  redisPort: 6379
  alertBotPort: 8088

secrets:
  # Значение переопределяется при helm install --set или из CI (GitLab Variable).
  appSharedSecret: "change-me"

alerting:
  # Включает production-like слой incident alerting: webhook bot + reporter + PrometheusRule.
  # По умолчанию выключено, чтобы не менять уже рабочий live-deploy перед сдачей.
  enabled: false
  clusterName: k3s-home
  appEnv: dev
  # Если secret уже создан вручную, задайте его имя здесь и chart не будет создавать новый secret.
  secrets:
    existingSecret: ""
    telegramBotToken: ""
    telegramChatId: ""
    telegramParseMode: HTML
    alertmanagerWebhookSecret: ""
    gitlabWebhookSecret: ""
  alertBot:
    logLevel: INFO
    sendRetries: 3
    sendTimeoutSeconds: 8
    # По умолчанию pod использует обычную Kubernetes-сеть.
    # Для домашнего стенда можно включить hostNetwork, если Telegram доступен с хоста,
    # но провайдер/прокси блокирует прямой egress из pod-сети.
    hostNetwork: false
    service:
      type: ClusterIP
  reporter:
    enabled: true
    # Редкий запуск снижает нагрузку; для защиты лучше запускать вручную kubectl create job --from=cronjob/...
    schedule: "0 */6 * * *"
    namespace: mega-coder
    prometheusUrl: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"
    lokiUrl: "http://loki.monitoring.svc:3100"
    sendReportToTelegram: false
  prometheusRule:
    enabled: true
    # kube-prometheus-stack часто выбирает PrometheusRule по label release=monitoring.
    labels:
      release: monitoring

config:
  api:
    serviceName: api
  worker:
    serviceName: worker

ingress:
  # Ingress сделан опциональным, чтобы chart можно было показать даже без ingress-controller.
  enabled: false
  className: nginx
  host: mega-coder.example.com

resources: {}
