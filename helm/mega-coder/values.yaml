# Параметры чарта — всё, что меняется при деплое, выносим сюда (требование ТЗ).
global:
  # Полный путь registry без завершающего слэша, например registry.gitlab.com/group/project
  imageRegistry: ""

nameOverride: ""
fullnameOverride: ""

# Namespace задаётся при установке: helm upgrade --install ... -n mega-coder --create-namespace

# Для приватного GitLab Registry CI подставляет --set-json (см. .gitlab-ci.yml).
imagePullSecrets: []

images:
  api:
    repository: api
    tag: "dev"
    pullPolicy: IfNotPresent
  web:
    repository: web
    tag: "dev"
    pullPolicy: IfNotPresent
  worker:
    repository: worker
    tag: "dev"
    pullPolicy: IfNotPresent
  redis:
    # Образ с Docker Hub; imageRegistry не наследуем от global (см. _helpers.tpl).
    imageRegistry: docker.io
    repository: library/redis
    tag: "7.2.7-alpine"
    pullPolicy: IfNotPresent

replicaCount:
  # По ТЗ у приложения должно быть минимум 2 реплики; Redis оставляем одиночным сервисом.
  api: 2
  web: 2
  worker: 2
  redis: 1

service:
  # В базовом варианте достаточно ClusterIP; внешний доступ можно дать через Ingress или port-forward.
  type: ClusterIP
  webPort: 8080
  apiPort: 8000
  workerPort: 8081
  redisPort: 6379

secrets:
  # Значение переопределяется при helm install --set или из CI (GitLab Variable).
  appSharedSecret: "change-me"

config:
  api:
    serviceName: api
  worker:
    serviceName: worker

ingress:
  # Ingress сделан опциональным, чтобы chart можно было показать даже без ingress-controller.
  enabled: false
  className: nginx
  host: mega-coder.example.com

resources: {}
