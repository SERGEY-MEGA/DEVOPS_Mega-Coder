# Упрощённый Loki stack: Loki + Promtail (сбор логов с нод и подов).
# Для production обычно используют отдельные чарты loki + promtail.

loki:
  enabled: true
  persistence:
    # Для demo достаточно ephemeral storage; для production лучше выносить данные во внешний storage.
    enabled: false
  config:
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

promtail:
  # Promtail читает container logs на нодах и отправляет их в Loki.
  enabled: true

grafana:
  # Вторую Grafana не поднимаем, потому что она уже есть в kube-prometheus-stack.
  enabled: false

prometheus:
  # Второй Prometheus тоже не нужен: метрики уже собираются отдельным релизом.
  enabled: false
