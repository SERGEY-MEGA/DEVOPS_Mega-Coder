---
# Отдельный playbook для строгого варианта ТЗ: 1 master + 1 worker.
# Последовательность запуска:
# 1) ansible-playbook -i inventory/hosts.ini site.yml
# 2) ansible-playbook -i inventory/hosts.ini k3s-cluster.yml

- name: Установить k3s server на master
  hosts: k8s_master
  become: true
  gather_facts: true
  vars:
    k3s_version: "v1.34.5+k3s1"
    k3s_disable_traefik: true
    k3s_disable_servicelb: true
  roles:
    - role: k3s_server

- name: Установить k3s agent на worker
  hosts: k8s_workers
  become: true
  gather_facts: true
  vars:
    k3s_version: "v1.34.5+k3s1"
  roles:
    - role: k3s_agent

- name: Проверить кластер после join worker
  hosts: k8s_master
  become: true
  gather_facts: false
  tasks:
    - name: Дождаться, пока обе ноды появятся в кластере
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: k3s_nodes
      changed_when: false
      retries: 20
      delay: 15
      until: k3s_nodes.stdout_lines | length >= 2

    - name: Показать найденные ноды
      ansible.builtin.debug:
        var: k3s_nodes.stdout_lines
