# Nginx как reverse-proxy к API и раздача статического фронтенда.
# Действия в конфиге:
# - слушаем порт из переменной окружения PORT (подставляется envsubst в entrypoint);
# - отдаём / из /usr/share/nginx/html;
# - проксируем /api/ на backend-сервис (имя хоста задаётся через API_UPSTREAM).

worker_processes auto;
# В rootless-режиме пишем логи в stdout/stderr и /tmp, а не в системные каталоги.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile        on;
    keepalive_timeout 65;

    server {
        listen ${PORT};
        server_name _;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass ${API_UPSTREAM};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
