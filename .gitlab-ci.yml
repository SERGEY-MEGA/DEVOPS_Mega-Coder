# GitLab CI/CD по ТЗ курса DevOps: стадии pre_build → build → deploy.
# Сборка через Kaniko (без docker:dind) — на shared runners GitLab не нужен privileged-режим.

stages:
  - pre_build
  - build
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  HELM_RELEASE: mega
  K8S_NAMESPACE: mega-coder
  KANIKO_CACHE_REPO: ${CI_REGISTRY_IMAGE}/cache

# --- pre_build: тег образа в dotenv для следующих job ---
prepare_image_tag:
  stage: pre_build
  image: alpine:3.21.0
  script:
    - echo "IMAGE_TAG=${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}" >> build.env
    - echo "REGISTRY_BASE=${CI_REGISTRY_IMAGE}" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

# Kaniko: пуш в GitLab Container Registry через CI_JOB_TOKEN
.kaniko_build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["prepare_image_tag"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "gitlab-ci-token" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build_api:
  extends: .kaniko_build
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

build_web:
  extends: .kaniko_build
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

build_worker:
  extends: .kaniko_build
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/worker" \
        --dockerfile "${CI_PROJECT_DIR}/worker/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/worker:${IMAGE_TAG}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

# --- deploy: Helm на main, с atomic rollback при неуспешном релизе ---
deploy_helm:
  stage: deploy
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  needs:
    - job: prepare_image_tag
    - job: build_api
    - job: build_web
    - job: build_worker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache kubectl
    - |
      if [ -z "${KUBE_CONFIG}" ]; then
        echo "Задайте переменную KUBE_CONFIG (тип File) в GitLab CI/CD Variables"
        exit 1
      fi
    - export KUBECONFIG="${KUBE_CONFIG}"
    - kubectl config current-context
  script:
    - kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - |
      kubectl create secret docker-registry gitlab-registry \
        --docker-server="${CI_REGISTRY}" \
        --docker-username="${CI_REGISTRY_USER}" \
        --docker-password="${CI_REGISTRY_PASSWORD}" \
        --namespace="${K8S_NAMESPACE}" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      helm upgrade --install "${HELM_RELEASE}" ./helm/mega-coder \
        --namespace "${K8S_NAMESPACE}" \
        --create-namespace \
        --set global.imageRegistry="${CI_REGISTRY_IMAGE}" \
        --set images.api.tag="${IMAGE_TAG}" \
        --set images.web.tag="${IMAGE_TAG}" \
        --set images.worker.tag="${IMAGE_TAG}" \
        --set-json 'imagePullSecrets=[{"name":"gitlab-registry"}]' \
        --set secrets.appSharedSecret="${APP_SHARED_SECRET:-change-me-in-gitlab-variable}" \
        --atomic \
        --cleanup-on-fail \
        --wait \
        --timeout 5m
