# GitLab CI/CD по ТЗ курса DevOps: стадии pre_build → build → deploy.
# Сборка через Kaniko (без docker:dind) — на shared runners GitLab не нужен privileged-режим.

stages:
  - pre_build
  - build
  - deploy

workflow:
  # Разделяем pipeline по источнику запуска:
  # merge request нужен для проверки сборки,
  # push в main дополнительно запускает deploy.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  # Эти переменные используются в deploy job и делают pipeline короче и понятнее.
  HELM_RELEASE: mega
  K8S_NAMESPACE: mega-coder
  # Kaniko складывает сюда кэш слоёв, чтобы ускорять повторные сборки образов.
  KANIKO_CACHE_REPO: ${CI_REGISTRY_IMAGE}/cache

# --- pre_build: тег образа в dotenv для следующих job ---
prepare_image_tag:
  stage: pre_build
  image: alpine:3.21.0
  script:
    # Один и тот же тег потом используется для api/web/worker, чтобы деплой ссылался на единый набор образов.
    - echo "IMAGE_TAG=${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}" >> build.env
    # Сохраняем базовый путь Registry как артефакт для следующих job.
    - echo "REGISTRY_BASE=${CI_REGISTRY_IMAGE}" >> build.env
    - cat build.env
  artifacts:
    reports:
      dotenv: build.env

# Kaniko: пуш в GitLab Container Registry через CI_JOB_TOKEN
.kaniko_build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  needs: ["prepare_image_tag"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    # Kaniko работает без docker daemon и читает registry auth из этого файла.
    - mkdir -p /kaniko/.docker
    # Используем встроенный CI_JOB_TOKEN, чтобы не хранить лишний пароль к Registry.
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "gitlab-ci-token" "${CI_JOB_TOKEN}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build_api:
  extends: .kaniko_build
  script:
    - |
      # Сборка и push backend-образа.
      # Для self-hosted лаб-стенда отключаем cache у API:
      # GitLab Registry периодически отдавал поврежденный cached layer (unexpected EOF),
      # из-за чего последний прогон падал на повторной сборке без изменений кода.
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/api" \
        --dockerfile "${CI_PROJECT_DIR}/api/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}" \
        --insecure-registry "${CI_REGISTRY}" \
        --cache=false

build_web:
  extends: .kaniko_build
  script:
    - |
      # Сборка frontend/reverse-proxy образа.
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/web" \
        --dockerfile "${CI_PROJECT_DIR}/web/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" \
        --insecure-registry "${CI_REGISTRY}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

build_worker:
  extends: .kaniko_build
  script:
    - |
      # Сборка вспомогательного worker-сервиса.
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/worker" \
        --dockerfile "${CI_PROJECT_DIR}/worker/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/worker:${IMAGE_TAG}" \
        --insecure-registry "${CI_REGISTRY}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

build_alert_bot:
  extends: .kaniko_build
  rules:
    # Alerting-компоненты opt-in: по умолчанию не трогаем рабочий deploy перед защитой.
    - if: $ENABLE_ALERTING_BUILDS == "true"
  script:
    - |
      # Сборка webhook bridge Alertmanager/Grafana/GitLab -> Telegram.
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/services/alert-bot" \
        --dockerfile "${CI_PROJECT_DIR}/services/alert-bot/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/alert-bot:${IMAGE_TAG}" \
        --insecure-registry "${CI_REGISTRY}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

build_reporter:
  extends: .kaniko_build
  rules:
    # Reporter тоже opt-in, чтобы не увеличивать время обычного pipeline.
    - if: $ENABLE_ALERTING_BUILDS == "true"
  script:
    - |
      # Сборка CronJob-сервиса, который формирует Markdown-отчёты по кластеру.
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/services/reporter" \
        --dockerfile "${CI_PROJECT_DIR}/services/reporter/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}/reporter:${IMAGE_TAG}" \
        --insecure-registry "${CI_REGISTRY}" \
        --cache=true \
        --cache-repo "${KANIKO_CACHE_REPO}"

# --- deploy: Helm на main, с atomic rollback при неуспешном релизе ---
deploy_helm:
  stage: deploy
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  needs:
    - job: prepare_image_tag
    - job: build_api
    - job: build_web
    - job: build_worker
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache kubectl
    - |
      # KUBE_CONFIG должен быть файловой GitLab Variable, иначе deploy не знает, в какой кластер идти.
      if [ -z "${KUBE_CONFIG}" ]; then
        echo "Задайте переменную KUBE_CONFIG (тип File) в GitLab CI/CD Variables"
        exit 1
      fi
    - export KUBECONFIG="${KUBE_CONFIG}"
    - kubectl config current-context
  script:
    # Namespace создаём идемпотентно: повторный запуск job ничего не ломает.
    - kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - |
      # Этот secret нужен Kubernetes, чтобы тянуть приватные образы из GitLab Container Registry.
      kubectl create secret docker-registry gitlab-registry \
        --docker-server="${CI_REGISTRY}" \
        --docker-username="${CI_REGISTRY_USER}" \
        --docker-password="${CI_REGISTRY_PASSWORD}" \
        --namespace="${K8S_NAMESPACE}" \
        --dry-run=client -o yaml | kubectl apply -f -
    - |
      # Helm ставит или обновляет release. --atomic и --cleanup-on-fail дают безопасный rollback.
      helm upgrade --install "${HELM_RELEASE}" ./helm/mega-coder \
        --namespace "${K8S_NAMESPACE}" \
        --create-namespace \
        --set global.imageRegistry="${CI_REGISTRY_IMAGE}" \
        --set images.api.tag="${IMAGE_TAG}" \
        --set images.web.tag="${IMAGE_TAG}" \
        --set images.worker.tag="${IMAGE_TAG}" \
        --set-json 'imagePullSecrets=[{"name":"gitlab-registry"}]' \
        --set secrets.appSharedSecret="${APP_SHARED_SECRET:-change-me-in-gitlab-variable}" \
        --atomic \
        --cleanup-on-fail \
        --wait \
        --timeout 5m
